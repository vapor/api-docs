name: PR - Closed
on:
  pull_request:
    branches:
      - main
    types: [closed]
permissions:
  contents: read
  id-token: write
  deployments: write

env:
  AWS_PAGER: ""

jobs:
  delete-s3:
    name: Delete S3 Website
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.head.repo.full_name == 'vapor/api-docs' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
          aws-region: ${{ vars.OIDC_ROLE_REGION }}
      - name: Delete Website Bucket
        uses: brokenhandsio/s3-website-pr-action@6ebd9b622b4bb33358228571a50e05d375cbd4de # v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          bucket-prefix: "vapor-api-docs-pulls"
          bucket-region: "eu-west-2"
