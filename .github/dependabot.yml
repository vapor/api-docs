version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      dependencies:
        patterns:
          - "*"
  # Kiln and VaporDesignTheme releases often land together (a design release can
  # raise its Kiln minimum), so group them into one PR that resolves cleanly.
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      swift-dependencies:
        patterns:
          - "*"
